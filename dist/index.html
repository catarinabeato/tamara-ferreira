<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamara Ferreira</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.tamaraferreira.pt/pt/">
<link rel="alternate" hreflang="pt" href="https://www.tamaraferreira.pt/pt/">
<link rel="alternate" hreflang="en" href="https://www.tamaraferreira.pt/en/">
<meta http-equiv="refresh" content="0; url=/pt/">
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#0B0B0B;color:#FFFFFF}p{letter-spacing:.12em;text-transform:uppercase;font-size:.8rem}a{color:inherit}</style>
</head>
<body>
<p><a href="/pt/" hreflang="pt">Português</a> &middot; <a href="/en/" hreflang="en">English</a></p>
<script>
  (function () {
    var supported = ["pt","en"];
    var paths = {"pt":"/pt/","en":"/en/"};
    var preferred = (navigator.languages || [navigator.language || 'pt'])
      .map(function (tag) { return String(tag).slice(0, 2).toLowerCase(); })
      .find(function (code) { return supported.indexOf(code) !== -1; });
    location.replace(paths[preferred] || '/pt/');
  })();
</script>
</body>
</html>
